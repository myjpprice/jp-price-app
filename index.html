<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>日本購物查價</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;padding:14px 14px 10px;border-bottom:1px solid #ddd}
h1{font-size:20px;margin:0 0 10px}.search{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.tabs{display:flex;gap:8px;margin-top:10px}.tabs button,.primary{border:0;border-radius:10px;padding:9px 13px;background:#eee}.tabs .on,.primary{background:#111;color:#fff}
main{padding:12px;max-width:720px;margin:auto}.card{background:#fff;border-radius:16px;margin:0 0 12px;overflow:hidden;box-shadow:0 1px 4px #0001;display:grid;grid-template-columns:110px 1fr}
.pic{width:110px;height:145px;object-fit:cover;background:#eee}.info{padding:12px}.name{font-weight:700;font-size:16px;margin-bottom:5px}.muted{color:#777;font-size:12px}.price{font-size:18px;font-weight:800;margin-top:8px}.price small{font-size:12px;font-weight:400;color:#777}.actions{display:flex;gap:6px;margin-top:10px}.actions button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:6px 9px}
.empty{text-align:center;color:#777;padding:60px 20px}.fab{position:fixed;right:18px;bottom:22px;width:56px;height:56px;border:0;border-radius:50%;background:#111;color:#fff;font-size:28px;box-shadow:0 4px 14px #0003}
dialog{width:min(94%,560px);border:0;border-radius:18px;padding:0;box-shadow:0 10px 40px #0005}dialog::backdrop{background:#0006}.form{padding:18px}.form h2{margin-top:0}.form label{display:block;font-size:13px;margin:10px 0 5px;color:#555}.form input,.form select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.preview{width:100%;max-height:180px;object-fit:contain;background:#eee;border-radius:10px;margin-top:8px;display:none}.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.form-actions button{padding:10px 15px;border-radius:9px;border:1px solid #ddd;background:#fff}.form-actions .save{background:#111;color:#fff;border:0}
</style>
</head>
<body>
<header>
<h1>日本購物查價</h1>
<input id="search" class="search" placeholder="搜尋品名、店家、分類、容量…">
<div class="tabs">
<button class="on" data-filter="all">全部</button><button data-filter="favorite">常用</button>
<button id="exportBtn">匯出</button><button id="importBtn">匯入</button>
<input id="importFile" type="file" accept=".json" hidden>
</div>
</header>
<main id="list"></main>
<button class="fab" id="add">＋</button>

<dialog id="dlg"><form class="form" id="form">
<h2 id="formTitle">新增商品</h2>
<input id="id" type="hidden">
<label>日期</label><input id="date" type="date" required>
<label>店家</label><input id="store" placeholder="例如：Lopia">
<div class="row"><div><label>大分類</label><input id="cat1" placeholder="食品"></div><div><label>細分類</label><input id="cat2" placeholder="咖哩"></div></div>
<label>圖片</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview">
<label>品名（含口味）</label><input id="name" required placeholder="商品名稱／口味">
<label>容量</label><input id="capacity" placeholder="例如：180g、6入">
<div class="row"><div><label>含稅價（¥）</label><input id="taxin" type="number" min="0" step="1"></div><div><label>免稅價（¥）</label><input id="taxout" type="number" min="0" step="1"></div></div>
<div class="form-actions"><button type="button" id="cancel">取消</button><button class="save">儲存</button></div>
</form></dialog>

<script>
const KEY="jp_price_items_v1";
let items=JSON.parse(localStorage.getItem(KEY)||"[]"), filter="all", editImage="";
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(items))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 const q=$("search").value.trim().toLowerCase();
 let arr=items.filter(x=>(filter==="all"||x.favorite)&&(!q||Object.values(x).join(" ").toLowerCase().includes(q)));
 $("list").innerHTML=arr.length?arr.map(x=>`
 <article class="card">
  ${x.image?`<img class="pic" src="${x.image}">`:`<div class="pic"></div>`}
  <div class="info">
   <div class="name">${esc(x.name)}</div>
   <div class="muted">${esc(x.capacity)}　${esc(x.cat1)} / ${esc(x.cat2)}</div>
   <div class="muted">🏪 ${esc(x.store)}　📅 ${esc(x.date)}</div>
   <div class="price">含稅 ¥${x.taxin||"-"} <small>／ 免稅 ¥${x.taxout||"-"}</small></div>
   <div class="actions"><button onclick="edit('${x.id}')">編輯</button><button onclick="fav('${x.id}')">${x.favorite?"★ 常用":"☆ 常用"}</button><button onclick="delItem('${x.id}')">刪除</button></div>
  </div>
 </article>`).join(""):`<div class="empty">尚無商品<br><br>按右下角「＋」開始建立查價清單</div>`;
}
function openNew(){
 $("form").reset();$("id").value="";$("date").value=new Date().toISOString().slice(0,10);
 $("formTitle").textContent="新增商品";editImage="";$("preview").style.display="none";$("dlg").showModal();
}
function edit(id){
 const x=items.find(a=>a.id===id); if(!x)return;
 for(const k of ["id","date","store","cat1","cat2","name","capacity","taxin","taxout"]) $(k).value=x[k]??"";
 editImage=x.image||"";$("formTitle").textContent="編輯商品";
 if(editImage){$("preview").src=editImage;$("preview").style.display="block"}else $("preview").style.display="none";
 $("dlg").showModal();
}
$("image").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{editImage=r.result;$("preview").src=editImage;$("preview").style.display="block"};r.readAsDataURL(f)};
$("form").onsubmit=e=>{e.preventDefault();const id=$("id").value||crypto.randomUUID();const old=items.find(x=>x.id===id);
 const x={id,date:$("date").value,store:$("store").value,cat1:$("cat1").value,cat2:$("cat2").value,name:$("name").value,capacity:$("capacity").value,taxin:$("taxin").value,taxout:$("taxout").value,image:editImage,favorite:old?.favorite||false};
 const i=items.findIndex(a=>a.id===id);i<0?items.unshift(x):items[i]=x;save();$("dlg").close();render();
};
$("add").onclick=openNew;$("cancel").onclick=()=>$("dlg").close();$("search").oninput=render;
document.querySelectorAll(".tabs button[data-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button[data-filter]").forEach(z=>z.classList.remove("on"));b.classList.add("on");filter=b.dataset.filter;render()});
window.edit=edit;window.delItem=id=>{if(confirm("確定刪除？")){items=items.filter(x=>x.id!==id);save();render()}};
window.fav=id=>{const x=items.find(a=>a.id===id);x.favorite=!x.favorite;save();render()};
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(items)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jp_price_backup.json";a.click()};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const incoming=JSON.parse(r.result);if(Array.isArray(incoming)){items=incoming;save();render();alert("匯入完成")}}catch{alert("檔案格式錯誤")}};r.readAsText(f)};
render();
</script>
</body>
</html>
