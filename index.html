<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本購物小清單</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#333333">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="日本購物清單">

    <style>
        /* 四季動態主題變數定義 */
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-main: #222222;
            --text-sub: #777777;
            --border-color: #eeeeee;
            --accent-color: #2e7d32;
            --danger-color: #d32f2f;
            --theme-primary: #e91e63; /* 預設秋/春過渡 */
            --theme-light: #fce4ec;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 頂部導覽列：極簡俐落 */
        .navbar {
            width: 100%;
            background: var(--card-bg);
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 1.3em;
            cursor: pointer;
            color: var(--text-main);
            padding: 0;
        }

        .nav-title {
            font-size: 1.05em;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .container {
            width: 92%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px 0;
            box-sizing: border-box;
        }

        /* 上傳區域：簡約虛線框 */
        .upload-section {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .file-label {
            display: block;
            border: 1.5px dashed #cccccc;
            color: var(--text-main);
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 0.95em;
        }

        .file-label:hover { 
            border-color: var(--theme-primary); 
            color: var(--theme-primary);
            background-color: var(--theme-light);
        }
        #file-input { display: none; }

        #loading, #error-msg { display: none; margin-top: 10px; font-size: 0.9em; font-weight: 500; }
        #loading { color: #1976d2; }
        #error-msg { color: var(--danger-color); }

        /* 清單卡片區塊 */
        .card-section {
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            box-sizing: border-box;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 0.95em;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 4px;
        }

        ul { list-style-type: none; padding: 0; margin: 0; }

        li {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }

        li:first-child { border-top: none; }
        li:last-child { border-bottom: none; }

        .item-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
            background-color: #f5f5f5;
        }
        .item-thumb[src=""], .item-thumb:not([src]) { display: none; }

        .item-details { flex-grow: 1; min-width: 0; }
        .item-name { font-weight: 600; font-size: 0.95em; margin: 0 0 2px 0; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-price { color: #c2185b; font-weight: 600; font-size: 0.9em; }
        .item-note { color: var(--text-sub); font-size: 0.8em; margin-top: 2px; }

        /* 實際購買價格輸入欄位 */
        .purchase-input-group {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 0.85em;
            color: var(--text-sub);
        }
        .purchase-input {
            width: 85px;
            padding: 3px 6px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.9em;
            outline: none;
        }
        .purchase-input:focus {
            border-color: var(--theme-primary);
        }

        /* 已勾選項目的柔和灰底與降彩度 */
        li.checked-item {
            background-color: #f5f5f5;
            padding-left: 8px;
            padding-right: 8px;
            border-radius: 6px;
            border-bottom: none;
            opacity: 0.55;
        }
        li.checked-item .item-name { color: #555; }
        li.checked-item .item-price { color: #888; }
        li.checked-item .item-note { color: #999; }
        li.checked-item .item-thumb { filter: grayscale(100%); }

        /* 按鈕風格群組 */
        .item-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .action-btn {
            background-color: transparent;
            color: var(--theme-primary);
            border: 1px solid var(--theme-primary);
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 500;
            transition: all 0.2s;
        }
        .action-btn:hover { background-color: var(--theme-primary); color: white; }

        .danger-btn {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }
        .danger-btn:hover { background-color: var(--danger-color); color: white; }

        /* 側邊欄抽屜 */
        .drawer {
            position: fixed;
            top: 0;
            left: -100%;
            width: 80%;
            max-width: 300px;
            height: 100%;
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            z-index: 1000;
            transition: left 0.25s ease;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .drawer.open { left: 0; }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 12px;
        }
        .drawer-header h3 { margin: 0; font-size: 1em; font-weight: 600; }
        .close-btn { background: none; border: none; font-size: 1.2em; cursor: pointer; color: var(--text-sub); }

        .drawer-content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }

        .menu-section-title {
            font-weight: 600;
            color: var(--text-sub);
            margin: 16px 0 6px 0;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        .menu-item-link {
            display: block;
            padding: 10px 12px;
            background: transparent;
            margin-bottom: 2px;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.9em;
            transition: background 0.15s;
        }
        .menu-item-link:hover { background: #f5f5f5; }

        .primary-full-btn {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: 500;
            font-size: 0.9em;
            margin-top: 12px;
        }
        .primary-full-btn:hover { opacity: 0.85; }

        /* 遮罩背景 */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            z-index: 999;
        }
        .overlay.show { display: block; }

        /* 通用彈窗樣式 */
        .modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            z-index: 1100;
            width: 88%;
            max-width: 360px;
            max-height: 80vh;
            display: none;
            box-sizing: border-box;
            flex-direction: column;
        }
        .modal.show { display: flex; }
        .modal h3 { margin: 0 0 16px 0; font-size: 1.05em; font-weight: 600; color: var(--text-main); text-align: center; flex-shrink: 0; }
        
        .modal-list-container {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            flex-grow: 1;
        }

        .modal-list-item {
            padding: 12px 14px;
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
        }
        .modal-list-item:hover {
            background: var(--theme-primary);
            color: white;
            border-color: var(--theme-primary);
        }

        .modal-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: #f9f9f9;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            gap: 8px;
        }
        .modal-item-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            min-width: 0;
            text-align: left;
        }
        .modal-item-info img {
            width: 40px; height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border-color); flex-shrink: 0;
        }
        .modal-item-text {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .modal-close-btn {
            width: 100%;
            padding: 10px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            flex-shrink: 0;
        }
        .modal-close-btn:hover { background: #e0e0e0; }

        #crop-canvas { display: none; }
    </style>
</head>
<body>

    <!-- 頂部導覽列 -->
    <div class="navbar">
        <button class="menu-btn" onclick="toggleDrawer(true)">☰</button>
        <h1 class="nav-title" id="page-title">日本購物小清單</h1>
        <div style="width: 20px;"></div>
    </div>

    <div class="container" id="main-container">
        <!-- 首頁預設畫面：無辨識結果時維持乾淨空白 -->
        <div class="upload-section">
            <label for="file-input" class="file-label">
                ＋ 拍攝或上傳商品照片
            </label>
            <input type="file" id="file-input" accept="image/*">
            <div id="loading">⚡ AI 辨識處理中...</div>
            <div id="error-msg">❌ 辨識失敗，請再試一次</div>
        </div>

        <div class="card-section" id="result-card-section" style="display: none;">
            <div class="card-header">辨識結果</div>
            <ul id="shopping-list"></ul>
        </div>
    </div>

    <!-- 左側選單抽屜 -->
    <div class="overlay" id="overlay" onclick="closeAllOverlays()"></div>
    <div class="drawer" id="history-drawer">
        <div class="drawer-header">
            <h3>選單</h3>
            <button class="close-btn" onclick="toggleDrawer(false)">✕</button>
        </div>
        <div class="drawer-content">
            <a href="#" class="menu-item-link" onclick="showHomeView()">Home</a>
            <a href="#" class="menu-item-link" onclick="showHistoryView()">價格庫</a>
            
            <div class="menu-section-title">我的清單</div>
            <div id="custom-lists-menu"></div>
            <button class="primary-full-btn" onclick="createNewShoppingList()">＋ 建立新清單</button>
        </div>
    </div>

    <!-- 彈窗 1：選擇要加入的目標清單 -->
    <div class="modal" id="add-to-list-modal">
        <h3>選擇要加入的清單</h3>
        <div class="modal-list-container" id="modal-list-container"></div>
        <button class="modal-close-btn" onclick="closeModal()">取消</button>
    </div>

    <!-- 彈窗 2：從價格庫挑選商品加入當前清單 -->
    <div class="modal" id="pick-from-history-modal">
        <h3 id="pick-modal-title">從價格庫挑選商品加入</h3>
        <div class="modal-list-container" id="pick-modal-list-container"></div>
        <button class="modal-close-btn" onclick="closePickModal()">關閉</button>
    </div>

    <canvas id="crop-canvas"></canvas>

    <script>
        const WORKER_URL = "https://jpprice-ocr.neptune8264.workers.dev";

        const fileInput = document.getElementById('file-input');
        const mainContainer = document.getElementById('main-container');
        const pageTitle = document.getElementById('page-title');
        const cropCanvas = document.getElementById('crop-canvas');
        const ctx = cropCanvas.getContext('2d');
        const drawer = document.getElementById('history-drawer');
        const overlay = document.getElementById('overlay');
        const modal = document.getElementById('add-to-list-modal');
        const modalListContainer = document.getElementById('modal-list-container');
        const pickModal = document.getElementById('pick-from-history-modal');
        const pickModalListContainer = document.getElementById('pick-modal-list-container');
        const pickModalTitle = document.getElementById('pick-modal-title');

        let selectedItemForAdd = null;
        let activeCustomListForAdding = null;

        document.addEventListener('DOMContentLoaded', () => {
            applySeasonalTheme();
            fileInput.addEventListener('change', handleImageUpload);
        });

        // 依據當前月份自動套用四季風格
        function applySeasonalTheme() {
            const month = new Date().getMonth() + 1;
            let primary, light;
            if (month >= 3 && month <= 5) {
                // 春天：櫻花粉紅風格
                primary = '#e91e63';
                light = '#fce4ec';
            } else if (month >= 6 && month <= 8) {
                // 夏天：水蜜桃風格
                primary = '#ff7043';
                light = '#fbe9e7';
            } else if (month >= 9 && month <= 11) {
                // 秋天：楓葉暖褐風格
                primary = '#d84315';
                light = '#fbe9e7';
            } else {
                // 冬天：溫泉舒適藍灰風格
                primary = '#0288d1';
                light = '#e1f5fe';
            }
            document.documentElement.style.setProperty('--theme-primary', primary);
            document.documentElement.style.setProperty('--theme-light', light);
        }

        function toggleDrawer(open) {
            if (open) {
                drawer.classList.add('open');
                overlay.classList.add('show');
                renderCustomListsMenu();
            } else {
                drawer.classList.remove('open');
                overlay.classList.remove('show');
            }
        }

        function closeAllOverlays() {
            toggleDrawer(false);
            closeModal();
            closePickModal();
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const errorMsg = document.getElementById('error-msg');
            const loadingText = document.getElementById('loading');
            errorMsg.style.display = 'none';
            loadingText.style.display = 'block';
            const currentFileInput = fileInput;
            
            try {
                const compressedBase64 = await compressImage(file, 500, 0.75);
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: compressedBase64 })
                });

                const data = await response.json();
                if (!response.ok || data.error) throw new Error(data.error || 'Worker response not ok');

                const processedItems = await processItemsCrops(data.items, compressedBase64);
                
                if (processedItems.length > 0) {
                    saveToHistory(processedItems);
                    renderHomeItems(processedItems);
                } else {
                    // 若無辨識結果維持空白
                    document.getElementById('result-card-section').style.display = 'none';
                }

            } catch (err) {
                console.error(err);
                errorMsg.style.display = 'block';
            } finally {
                loadingText.style.display = 'none';
                currentFileInput.value = '';
            }
        }

        function compressImage(file, maxWidth = 500, quality = 0.75) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.naturalWidth;
                        let height = img.naturalHeight;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const cCtx = canvas.getContext('2d');
                        cCtx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        async function processItemsCrops(items, base64Image) {
            if (!items || items.length === 0) return [];
            const originalImg = new Image();
            originalImg.src = base64Image;
            await originalImg.decode();

            let results = [];
            for (const item of items) {
                let thumbUrl = '';
                if (item.box_2d && item.box_2d.length === 4) {
                    try {
                        const [ymin, xmin, ymax, xmax] = item.box_2d;
                        const cropX = (xmin / 1000) * originalImg.naturalWidth;
                        const cropY = (ymin / 1000) * originalImg.naturalHeight;
                        const cropWidth = ((xmax - xmin) / 1000) * originalImg.naturalWidth;
                        const cropHeight = ((ymax - ymin) / 1000) * originalImg.naturalHeight;

                        if (cropWidth > 0 && cropHeight > 0) {
                            cropCanvas.width = cropWidth;
                            cropCanvas.height = cropHeight;
                            ctx.drawImage(originalImg, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);
                            thumbUrl = cropCanvas.toDataURL('image/jpeg', 0.8);
                        }
                    } catch (cropErr) { console.error("裁切失敗:", cropErr); }
                }

                results.push({
                    id: 'item_' + Math.random().toString(36).substr(2, 9),
                    name: item.name || '未命名商品',
                    price: item.price || '', // 無價格時保持空白供手動輸入
                    note: item.note || '',
                    thumb: thumbUrl
                });
            }
            return results;
        }

        function saveToHistory(items) {
            let history = JSON.parse(localStorage.getItem('all_shopping_history') || '[]');
            history.unshift({ time: new Date().toLocaleString(), items: items });
            localStorage.setItem('all_shopping_history', JSON.stringify(history));
        }

        function showHomeView() {
            toggleDrawer(false);
            pageTitle.innerText = "日本購物小清單";
            mainContainer.innerHTML = `
                <div class="upload-section">
                    <label for="file-input" class="file-label">＋ 拍攝或上傳商品照片</label>
                    <input type="file" id="file-input" accept="image/*">
                    <div id="loading">⚡ AI 辨識處理中...</div>
                    <div id="error-msg">❌ 辨識失敗，請再試一次</div>
                </div>
                <div class="card-section" id="result-card-section" style="display: none;">
                    <div class="card-header">辨識結果</div>
                    <ul id="shopping-list"></ul>
                </div>
            `;
            document.getElementById('file-input').addEventListener('change', handleImageUpload);
        }

        function renderHomeItems(items) {
            const section = document.getElementById('result-card-section');
            const listUl = document.getElementById('shopping-list');
            listUl.innerHTML = '';
            if (items.length === 0) {
                section.style.display = 'none';
            } else {
                section.style.display = 'block';
                items.forEach(item => listUl.appendChild(createItemNode(item, 'home')));
            }
        }

        function showHistoryView() {
            toggleDrawer(false);
            pageTitle.innerText = "價格庫";
            mainContainer.innerHTML = `
                <div class="card-section">
                    <div class="card-header">所有拍照紀錄</div>
                    <div id="history-content" style="margin-top: 10px;"></div>
                </div>
            `;
            const history = JSON.parse(localStorage.getItem('all_shopping_history') || '[]');
            const container = document.getElementById('history-content');
            if (history.length === 0) {
                container.innerHTML = '<p style="color: var(--text-sub); font-size: 0.9em;"><em>尚無價格庫紀錄</em></p>';
                return;
            }

            history.forEach((batch, batchIdx) => {
                const group = document.createElement('div');
                group.style.marginBottom = "16px";
                group.innerHTML = `<p style="font-weight:600; color:var(--text-sub); font-size:0.85em; margin:0 0 6px 0;">${batch.time}</p>`;
                const ul = document.createElement('ul');
                batch.items.forEach(item => ul.appendChild(createItemNode(item, 'history', false, null, batchIdx)));
                group.appendChild(ul);
                container.appendChild(group);
            });
        }

        function createItemNode(item, mode = 'home', isChecked = false, customListName = null, batchIdx = null) {
            const li = document.createElement('li');
            if (isChecked) li.classList.add('checked-item');

            if (customListName) {
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = isChecked;
                checkbox.style.transform = 'scale(1.1)';
                checkbox.style.cursor = 'pointer';
                checkbox.onchange = () => toggleCheckItem(customListName, item.id, checkbox.checked);
                li.appendChild(checkbox);
            }

            const imgThumb = document.createElement('img');
            imgThumb.className = 'item-thumb';
            if (item.thumb) imgThumb.src = item.thumb;
            li.appendChild(imgThumb);

            const detailsDiv = document.createElement('div');
            detailsDiv.className = 'item-details';
            
            // 價格格式處理：支援含稅(未稅)與空白手動輸入
            let priceHtml = '';
            if (mode === 'custom') {
                priceHtml = `<span class="item-price">標示：${item.price || '未標示'}</span>`;
            } else {
                priceHtml = `<span class="item-price">${item.price || ''}</span>`;
            }

            detailsDiv.innerHTML = `
                <p class="item-name">${item.name}</p>
                <div>${priceHtml}</div>
                ${item.note ? `<p class="item-note">${item.note}</p>` : ''}
            `;

            // 自訂清單額外加入「實際購買價格」輸入欄位
            if (mode === 'custom') {
                const purchaseDiv = document.createElement('div');
                purchaseDiv.className = 'purchase-input-group';
                purchaseDiv.innerHTML = `<span>實買:</span>`;
                const purchaseInput = document.createElement('input');
                purchaseInput.type = 'text';
                purchaseInput.className = 'purchase-input';
                purchaseInput.placeholder = '輸入價格';
                purchaseInput.value = item.purchasePrice || '';
                purchaseInput.onchange = () => updatePurchasePrice(customListName, item.id, purchaseInput.value);
                purchaseDiv.appendChild(purchaseInput);
                detailsDiv.appendChild(purchaseDiv);
            }

            li.appendChild(detailsDiv);

            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'item-actions';

            if (mode === 'home' || mode === 'history') {
                const addBtn = document.createElement('button');
                addBtn.className = 'action-btn';
                addBtn.innerText = '＋ 加入';
                addBtn.onclick = () => openAddToListModal(item);
                actionsDiv.appendChild(addBtn);

                const delBtn = document.createElement('button');
                delBtn.className = 'action-btn danger-btn';
                delBtn.innerText = '刪除';
                delBtn.onclick = () => {
                    if (mode === 'home') {
                        li.remove();
                        const listUl = document.getElementById('shopping-list');
                        if (listUl.children.length === 0) {
                            document.getElementById('result-card-section').style.display = 'none';
                        }
                    } else if (mode === 'history') {
                        deleteHistoryItem(batchIdx, item.id);
                    }
                };
                actionsDiv.appendChild(delBtn);
            } else if (mode === 'custom') {
                const delBtn = document.createElement('button');
                delBtn.className = 'action-btn danger-btn';
                delBtn.innerText = '刪除';
                delBtn.onclick = () => deleteCustomListItem(customListName, item.id);
                actionsDiv.appendChild(delBtn);
            }

            li.appendChild(actionsDiv);
            return li;
        }

        function renderCustomListsMenu() {
            const menuContainer = document.getElementById('custom-lists-menu');
            const lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            const keys = Object.keys(lists);

            menuContainer.innerHTML = '';
            if (keys.length === 0) {
                menuContainer.innerHTML = '<p style="font-size:0.85em; color:var(--text-sub); padding: 4px 12px;">尚未建立清單</p>';
                return;
            }

            keys.forEach(listName => {
                const a = document.createElement('a');
                a.href = '#';
                a.className = 'menu-item-link';
                a.innerText = `${listName} (${lists[listName].length})`;
                a.onclick = () => showCustomListView(listName);
                menuContainer.appendChild(a);
            });
        }

        function createNewShoppingList() {
            const name = prompt('請輸入新清單名稱：');
            if (!name) return;
            let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            if (lists[name]) {
                alert('此清單名稱已存在');
                return;
            }
            lists[name] = [];
            localStorage.setItem('custom_shopping_lists', JSON.stringify(lists));
            renderCustomListsMenu();
            showCustomListView(name);
        }

        function openAddToListModal(item) {
            let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            const keys = Object.keys(lists);
            if (keys.length === 0) {
                alert('請先在側邊欄選單建立至少一個購物清單');
                return;
            }
            selectedItemForAdd = item;
            modalListContainer.innerHTML = '';
            
            keys.forEach(k => {
                const div = document.createElement('div');
                div.className = 'modal-list-item';
                div.innerText = k;
                div.onclick = () => confirmAddItemToList(k);
                modalListContainer.appendChild(div);
            });

            modal.classList.add('show');
            overlay.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            overlay.classList.remove('show');
            selectedItemForAdd = null;
        }

        function confirmAddItemToList(targetList) {
            if (!selectedItemForAdd) return;
            let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            
            if (lists[targetList]) {
                const exists = lists[targetList].some(e => e.item.id === selectedItemForAdd.id);
                if (exists) {
                    alert('此商品已經在清單中了！');
                    closeModal();
                    return;
                }
                // 儲存時保留 purchasePrice 欄位
                lists[targetList].push({ item: { ...selectedItemForAdd, purchasePrice: '' }, checked: false });
                localStorage.setItem('custom_shopping_lists', JSON.stringify(lists));
                alert(`已加入「${targetList}」`);
            }
            closeModal();
        }

        function openPickFromHistoryModal(listName) {
            activeCustomListForAdding = listName;
            pickModalTitle.innerText = `從價格庫挑選商品`;
            pickModalListContainer.innerHTML = '';

            let history = JSON.parse(localStorage.getItem('all_shopping_history') || '[]');
            let allItemsMap = new Map();
            history.forEach(batch => {
                batch.items.forEach(item => {
                    if (!allItemsMap.has(item.id)) {
                        allItemsMap.set(item.id, item);
                    }
                });
            });

            const uniqueItems = Array.from(allItemsMap.values());
            if (uniqueItems.length === 0) {
                pickModalListContainer.innerHTML = '<p style="text-align:center; color:var(--text-sub); font-size:0.9em; padding:20px;">價格庫中尚無任何商品，請先拍攝商品照片</p>';
            } else {
                uniqueItems.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'modal-item-row';
                    row.innerHTML = `
                        <div class="modal-item-info">
                            <img src="${item.thumb || ''}" onerror="this.style.display='none'">
                            <div class="modal-item-text">${item.name} <br><span style="color:#c2185b; font-weight:normal;">${item.price || '未標示'}</span></div>
                        </div>
                    `;
                    const addBtn = document.createElement('button');
                    addBtn.className = 'action-btn';
                    addBtn.innerText = '＋ 加入';
                    addBtn.onclick = () => {
                        addItemDirectlyToCustomList(listName, item);
                    };
                    row.appendChild(addBtn);
                    pickModalListContainer.appendChild(row);
                });
            }

            pickModal.classList.add('show');
            overlay.classList.add('show');
        }

        function closePickModal() {
            pickModal.classList.remove('show');
            overlay.classList.remove('show');
            activeCustomListForAdding = null;
        }

        function addItemDirectlyToCustomList(listName, item) {
            let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            if (lists[listName]) {
                const exists = lists[listName].some(e => e.item.id === item.id);
                if (exists) {
                    alert('此商品已經在清單中了！');
                    return;
                }
                lists[listName].push({ item: { ...item, purchasePrice: '' }, checked: false });
                localStorage.setItem('custom_shopping_lists', JSON.stringify(lists));
                showCustomListView(listName);
                closePickModal();
            }
        }

        function showCustomListView(listName) {
            toggleDrawer(false);
            pageTitle.innerText = listName;
            mainContainer.innerHTML = `
                <div class="card-section">
                    <div class="card-header" style="padding-bottom: 8px;">
                        <span>清單項目</span>
                        <div style="display:flex; gap:6px;">
                            <button class="action-btn" onclick="openPickFromHistoryModal('${listName}')">＋ 從價格庫加入</button>
                            <button class="action-btn danger-btn" onclick="deleteCustomList('${listName}')">刪除清單</button>
                        </div>
                    </div>
                    <ul id="custom-list-items" style="margin-top: 10px;"></ul>
                </div>
            `;

            let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            const items = lists[listName] || [];
            const ul = document.getElementById('custom-list-items');

            if (items.length === 0) {
                ul.innerHTML = '<li><em style="color: var(--text-sub); font-size: 0.9em;">此清單目前沒有物品，可點擊上方「＋ 從價格庫加入」</em></li>';
                return;
            }

            items.forEach((entry) => {
                ul.appendChild(createItemNode(entry.item, 'custom', entry.checked, listName));
            });
        }

        function toggleCheckItem(listName, itemId, isChecked) {
            let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            if (lists[listName]) {
                const target = lists[listName].find(e => e.item.id === itemId);
                if (target) {
                    target.checked = isChecked;
                    localStorage.setItem('custom_shopping_lists', JSON.stringify(lists));
                    showCustomListView(listName);
                }
            }
        }

        function updatePurchasePrice(listName, itemId, priceVal) {
            let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            if (lists[listName]) {
                const target = lists[listName].find(e => e.item.id === itemId);
                if (target) {
                    target.item.purchasePrice = priceVal;
                    localStorage.setItem('custom_shopping_lists', JSON.stringify(lists));
                }
            }
        }

        function deleteHistoryItem(batchIdx, itemId) {
            let history = JSON.parse(localStorage.getItem('all_shopping_history') || '[]');
            if (history[batchIdx]) {
                history[batchIdx].items = history[batchIdx].items.filter(item => item.id !== itemId);
                if (history[batchIdx].items.length === 0) {
                    history.splice(batchIdx, 1);
                }
                localStorage.setItem('all_shopping_history', JSON.stringify(history));
                showHistoryView();
            }
        }

        function deleteCustomListItem(listName, itemId) {
            let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
            if (lists[listName]) {
                lists[listName] = lists[listName].filter(entry => entry.item.id !== itemId);
                localStorage.setItem('custom_shopping_lists', JSON.stringify(lists));
                showCustomListView(listName);
            }
        }

        function deleteCustomList(listName) {
            if (confirm(`確定刪除整本「${listName}」清單？`)) {
                let lists = JSON.parse(localStorage.getItem('custom_shopping_lists') || '{}');
                delete lists[listName];
                localStorage.setItem('custom_shopping_lists', JSON.stringify(lists));
                showHomeView();
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW 註冊失敗', err));
        }
    </script>
</body>
</html>
