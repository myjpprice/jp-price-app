<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本購物小清單 (極速 AI 裁切版)</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --danger-color: #f44336;
            --bg-color: #f4f4f9;
            --border-color: #ddd;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: #333; margin-bottom: 10px; font-size: 1.4em; text-align: center; }

        /* 上傳區域 */
        .upload-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .file-label {
            display: block;
            border: 2px dashed var(--primary-color);
            color: var(--primary-color);
            padding: 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .file-label:hover { background-color: #e8f5e9; }
        #file-input { display: none; }

        /* 載入與錯誤訊息 */
        #loading, #error-msg { display: none; margin-top: 10px; font-weight: bold; }
        #loading { color: #2196F3; }
        #error-msg { color: var(--danger-color); }

        /* 購物清單區域 */
        #list-section {
            width: 90%;
            max-width: 600px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        ul { list-style-type: none; padding: 0; margin: 0; }

        li {
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            display: flex;
            align-items: flex-start;
        }

        li:last-child { border-bottom: none; }

        /* 裁切縮圖樣式 */
        .item-thumb {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 15px;
            border: 1px solid #eee;
            flex-shrink: 0;
            background-color: #f0f0f0;
        }
        
        .item-thumb[src=""], .item-thumb:not([src]) {
             display: none;
        }

        .item-details { flex-grow: 1; }
        .item-name { font-weight: bold; font-size: 1.05em; margin: 0 0 5px 0; color: #333; }
        .item-price { color: #e91e63; font-weight: bold; font-size: 1.05em; }
        .item-note { color: #777; font-size: 0.85em; margin-top: 3px;}

        #crop-canvas { display: none; }
    </style>
</head>
<body>

    <h1>🛒 日本戰利品清單 (極速 AI 裁切)</h1>

    <div class="upload-section">
        <label for="file-input" class="file-label">
            📸 選擇相片或拍照上傳 (極速辨識)
        </label>
        <input type="file" id="file-input" accept="image/*">
        <div id="loading">⚡ 極速壓縮與 AI 辨識中...</div>
        <div id="error-msg">❌ 發生錯誤：未能成功辨識圖片</div>
    </div>

    <div id="list-section">
        <ul id="shopping-list">
            <!-- 辨識結果將動態插入這裡 -->
        </ul>
    </div>

    <canvas id="crop-canvas"></canvas>

    <script>
        // 你的 Cloudflare Worker 網址
        const WORKER_URL = "https://jpprice-ocr.neptune8264.workers.dev";

        const fileInput = document.getElementById('file-input');
        const shoppingList = document.getElementById('shopping-list');
        const loadingText = document.getElementById('loading');
        const errorMsg = document.getElementById('error-msg');
        const cropCanvas = document.getElementById('crop-canvas');
        const ctx = cropCanvas.getContext('2d');

        fileInput.addEventListener('change', handleImageUpload);

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            shoppingList.innerHTML = '';
            errorMsg.style.display = 'none';
            loadingText.style.display = 'block';
            const currentFileInput = fileInput;
            
            try {
                // 1. 在前端進行圖片壓縮與縮小，大幅提升上傳與 AI 處理速度
                const compressedBase64 = await compressImage(file, 800, 0.8);
                
                // 2. 將壓縮後的 Base64 送往 Worker 進行辨識
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: compressedBase64 })
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error || 'Worker response not ok');
                }

                // 3. 渲染清單與裁切小圖（以壓縮後的圖片作為基準來裁切）
                await renderListWithCrops(data.items, compressedBase64);

            } catch (err) {
                console.error(err);
                errorMsg.innerText = '❌ 辨識失敗: ' + err.message;
                errorMsg.style.display = 'block';
            } finally {
                loadingText.style.display = 'none';
                currentFileInput.value = '';
            }
        }

        // 圖片壓縮輔助函數：限制最大寬度，並轉為 JPEG
        function compressImage(file, maxWidth = 800, quality = 0.8) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.naturalWidth;
                        let height = img.naturalHeight;

                        // 超過最大寬度時等比例縮小
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const cCtx = canvas.getContext('2d');
                        cCtx.drawImage(img, 0, 0, width, height);

                        // 輸出壓縮後的 Base64
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        // 核心函數：渲染清單並在前端執行圖片裁切
        async function renderListWithCrops(items, base64Image) {
            if (!items || items.length === 0) {
                shoppingList.innerHTML = '<li><em>AI 沒有識別到商品</em></li>';
                return;
            }

            const originalImg = new Image();
            originalImg.src = base64Image;
            await originalImg.decode();

            for (const item of items) {
                const li = document.createElement('li');
                const imgThumb = document.createElement('img');
                imgThumb.className = 'item-thumb';

                if (item.box_2d && item.box_2d.length === 4) {
                    try {
                        const [ymin, xmin, ymax, xmax] = item.box_2d;
                        
                        const scaleX = originalImg.naturalWidth / 100;
                        const scaleY = originalImg.naturalHeight / 100;

                        const cropX = xmin * scaleX;
                        const cropY = ymin * scaleY;
                        const cropWidth = (xmax - xmin) * scaleX;
                        const cropHeight = (ymax - ymin) * scaleX; // 修正比例對應

                        if (cropWidth > 0 && cropHeight > 0) {
                            cropCanvas.width = cropWidth;
                            cropCanvas.height = cropHeight;

                            ctx.drawImage(
                                originalImg,
                                cropX, cropY, cropWidth, cropHeight,
                                0, 0, cropWidth, cropHeight
                            );

                            imgThumb.src = cropCanvas.toDataURL('image/jpeg', 0.8);
                        }
                    } catch (cropErr) {
                        console.error("客戶端裁切失敗:", cropErr);
                    }
                }

                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'item-details';

                const nameP = document.createElement('p');
                nameP.className = 'item-name';
                nameP.innerText = item.name || '未命名商品';

                const priceSpan = document.createElement('span');
                priceSpan.className = 'item-price';
                priceSpan.innerText = item.price || '未標示';
                
                const noteP = document.createElement('p');
                noteP.className = 'item-note';
                noteP.innerText = item.note || '';

                detailsDiv.appendChild(nameP);
                detailsDiv.appendChild(priceSpan);
                if (item.note) detailsDiv.appendChild(noteP);

                li.appendChild(imgThumb);
                li.appendChild(detailsDiv);
                shoppingList.appendChild(li);
            }
        }
    </script>
</body>
</html>
