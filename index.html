<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本購物小清單</title>
<style>
:root{--main:#3d3132;--sub:#826e71;--primary:#e64a75;--danger:#d32f2f;--glass:rgba(255,255,255,0.45)}
body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#fff2f5,#ffe6ec,#ffd6e0);color:var(--main);margin:0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
#bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.navbar,.container,.drawer,.overlay,.modal{position:relative;z-index:10}
.navbar{width:100%;background:rgba(255,255,255,0.35);backdrop-filter:blur(25px);padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:space-between;box-sizing:border-box;position:sticky;top:0}
.menu-btn{background:none;border:0;font-size:1.2em;cursor:pointer}
.container{width:90%;max-width:500px;display:flex;flex-direction:column;gap:20px;padding:28px 0;box-sizing:border-box}
.file-label{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--glass);backdrop-filter:blur(20px);padding:20px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,0.6);font-weight:500;box-shadow:0 10px 30px rgba(230,74,117,0.05)}
#file-input{display:none}
#loading,#error-msg{display:none;margin-top:10px;font-size:0.85em}
#loading{color:var(--primary)} #error-msg{color:var(--danger)}
.search-box{width:100%;padding:12px;margin-bottom:10px;box-sizing:border-box;background:var(--glass);border:1px solid rgba(255,255,255,0.7);border-radius:12px;outline:none}
.card{width:100%;background:var(--glass);backdrop-filter:blur(22px);border-radius:22px;border:1px solid rgba(255,255,255,0.65);padding:20px;box-sizing:border-box;box-shadow:0 15px 45px rgba(230,74,117,0.05)}
.card-header{display:flex;justify-content:space-between;font-size:0.9em;border-bottom:1px solid rgba(255,255,255,0.5);padding-bottom:10px;margin-bottom:6px;color:var(--sub)}
ul{list-style:none;padding:0;margin:0}
li{border-bottom:1px solid rgba(255,255,255,0.3);padding:12px 0;display:flex;align-items:center;gap:12px}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:10px;border:1px solid #fff;background:#fff}
.thumb:not([src]),.thumb[src=""]{display:none}
.details{flex-grow:1;min-width:0}
.name{font-weight:500;font-size:0.9em;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:var(--primary);font-size:0.85em}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.badge{font-size:0.7em;padding:2px 6px;border-radius:6px}
.b-store{background:rgba(0,122,255,0.1);color:#007aff} .b-cat{background:rgba(52,199,89,0.1);color:#248a3d} .b-date{background:rgba(0,0,0,0.05);color:var(--sub)}
li.checked{opacity:0.4}
.actions{display:flex;gap:4px}
.btn{background:rgba(255,255,255,0.6);color:var(--primary);border:1px solid rgba(230,74,117,0.3);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:0.75em}
.btn-danger{color:var(--danger);border-color:rgba(211,47,47,0.3)}
.drawer{position:fixed;top:0;left:-100%;width:260px;height:100%;background:rgba(255,255,255,0.8);backdrop-filter:blur(30px);z-index:1000;transition:left 0.3s;padding:20px;box-sizing:border-box;display:flex;flex-direction:column}
.drawer.open{left:0}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.15);display:none;z-index:999}
.overlay.show{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.9);backdrop-filter:blur(30px);padding:20px;border-radius:20px;z-index:1100;width:80%;max-width:320px;display:none;flex-direction:column;box-sizing:border-box}
.modal.show{display:flex}
.modal-list{overflow-y:auto;max-height:200px;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.modal-item{padding:10px;background:rgba(255,255,255,0.6);border-radius:10px;cursor:pointer;text-align:center;font-size:0.85em}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="navbar">
    <button class="menu-btn" onclick="toggleDrawer(true)">☰</button>
    <h1 id="title" style="font-size:1em;margin:0">🍑 日本購物清單</h1>
    <div style="width:20px"></div>
</div>
<div class="container" id="main">
    <div style="text-align:center">
        <label for="file-input" class="file-label"><span>🍑 拍攝或上傳商品照片</span></label>
        <input type="file" id="file-input" accept="image/*">
        <div id="loading">⚡ AI 辨識中...</div>
        <div id="error-msg">❌ 辨識失敗，請重試</div>
    </div>
    <div class="card" id="res-card" style="display:none">
        <div class="card-header">辨識結果</div>
        <ul id="list"></ul>
    </div>
</div>
<div class="overlay" id="overlay" onclick="closeAll()"></div>
<div class="drawer" id="drawer">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:10px">
        <h3 style="margin:0;font-size:0.9em">選單</h3><button class="menu-btn" onclick="toggleDrawer(false)">✕</button>
    </div>
    <div style="flex-grow:1;overflow-y:auto;padding-top:10px">
        <a href="#" onclick="showHome()" style="display:block;padding:8px;color:#333;text-decoration:none">Home</a>
        <a href="#" onclick="showHistory()" style="display:block;padding:8px;color:#333;text-decoration:none">價格庫</a>
        <div style="font-size:0.75em;color:var(--sub);margin:10px 0 4px">我的清單</div>
        <div id="custom-menu"></div>
        <button class="btn" style="width:100%;margin-top:10px;background:var(--primary);color:#fff" onclick="newList()">＋ 建立新清單</button>
    </div>
</div>
<div class="modal" id="modal">
    <h3 style="margin:0 0 10px;text-align:center;font-size:0.9em">選擇清單</h3>
    <div class="modal-list" id="modal-list"></div>
    <button class="btn" onclick="closeAll()">取消</button>
</div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const API="https://jpprice-ocr.neptune8264.workers.dev";
const fileInput=document.getElementById('file-input'),main=document.getElementById('main'),title=document.getElementById('title');
const drawer=document.getElementById('drawer'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal'),canvas=document.getElementById('canvas');

document.addEventListener('DOMContentLoaded',()=>{
    initBg(); fileInput.addEventListener('change',handleUpload);
});

function initBg(){
    const c=document.getElementById('bg'),ctx=c.getContext('2d');
    function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
    resize();window.addEventListener('resize',resize);
    let pts=Array.from({length:10},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*3+1,s:Math.random()*0.2+0.1}));
    function anim(){
        ctx.clearRect(0,0,c.width,c.height);
        pts.forEach(p=>{ctx.fillStyle='rgba(230,74,117,0.2)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();p.y+=p.s;if(p.y>c.height)p.y=0;});
        requestAnimationFrame(anim);
    }
    anim();
}

function toggleDrawer(op){drawer.classList.toggle('open',op);overlay.classList.toggle('show',op);if(op)renderCustomMenu();}
function closeAll(){drawer.classList.remove('open');modal.classList.remove('show');overlay.classList.remove('show');}

async function handleUpload(e){
    const f=e.target.files[0];if(!f)return;
    document.getElementById('error-msg').style.display='none';document.getElementById('loading').style.display='block';
    try{
        const b64=await compress(f);
        const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:b64})});
        const data=await res.json();if(data.error)throw data.error;
        const items=await processItems(data.items,b64);
        if(items.length){saveHist(items);renderHome(items);}
    }catch(err){document.getElementById('error-msg').style.display='block';}
    finally{document.getElementById('loading').style.display='none';fileInput.value='';}
}

function compress(file){
    return new Promise(res=>{
        const r=new FileReader();r.readAsDataURL(file);
        r.onload=e=>{
            const img=new Image();img.src=e.target.result;
            img.onload=()=>{
                let w=img.width,h=img.height;if(w>400){h=Math.round(h*400/w);w=400;}
                canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
                res(canvas.toDataURL('image/jpeg',0.7));
            }
        }
    });
}

async function processItems(items,b64){
    if(!items?.length)return[];
    const img=new Image();img.src=b64;await img.decode();
    let res=[];
    for(let i of items){
        let thumb='';
        if(i.box_2d?.length===4){
            let [ymin,xmin,ymax,xmax]=i.box_2d;
            let x=xmin/1000*img.width,y=ymin/1000*img.height,w=(xmax-xmin)/1000*img.width,h=(ymax-ymin)/1000*img.height;
            if(w>0&&h>0){canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,x,y,w,h,0,0,w,h);thumb=canvas.toDataURL('image/jpeg',0.7);}
        }
        res.push({id:'i_'+Math.random().toString(36).substr(2,6),name:i.name||'商品',price:i.price||'',note:i.note||'',thumb});
    }
    return res;
}

function saveHist(items){
    let h=JSON.parse(localStorage.getItem('h')||'[]');
    h.unshift({time:new Date().toLocaleString(),items});
    localStorage.setItem('h',JSON.stringify(h));
}

function parseMeta(item){
    let p=(item.note||'').split('|');
    return{date:p[0]?.trim()||'',store:p[1]?.trim()||'未知店鋪',cat:item.category||'生活雜貨'};
}

function showHome(){
    closeAll();title.innerText="🍑 日本購物清單";
    main.innerHTML=`<div style="text-align:center"><label for="file-input" class="file-label"><span>🍑 拍攝或上傳商品照片</span></label><input type="file" id="file-input" accept="image/*"><div id="loading">⚡ AI 辨識中...</div><div id="error-msg">❌ 辨識失敗，請重試</div></div><div class="card" id="res-card" style="display:none"><div class="card-header">辨識結果</div><ul id="list"></ul></div>`;
    document.getElementById('file-input').addEventListener('change',handleUpload);
}

function renderHome(items){
    document.getElementById('res-card').style.display='block';
    const ul=document.getElementById('list');ul.innerHTML='';
    items.forEach(i=>ul.appendChild(createNode(i,'home')));
}

function showHistory(){
    closeAll();title.innerText="價格庫";
    const h=JSON.parse(localStorage.getItem('h')||'[]');
    main.innerHTML=`<div class="card"><input type="text" class="search-box" placeholder="🔍 搜尋..." oninput="filterHist(this.value)"><ul id="hist-list"></ul></div>`;
    renderHistList(h,'');
}

function filterHist(q){renderHistList(JSON.parse(localStorage.getItem('h')||'[]'),q.toLowerCase());}

function renderHistList(h,q){
    const ul=document.getElementById('hist-list');ul.innerHTML='';
    let flat=[];h.forEach((b,bIdx)=>b.items.forEach(i=>flat.push({item:i,bIdx})));
    let filtered=flat.filter(x=>(x.item.name+x.item.note).toLowerCase().includes(q));
    if(!filtered.length){ul.innerHTML='<p style="text-align:center;color:var(--sub);font-size:0.8em">無紀錄</p>';return;}
    filtered.forEach(x=>ul.appendChild(createNode(x.item,'history',false,null,x.bIdx)));
}

function createNode(item,mode,chk=false,list=null,bIdx=null){
    const li=document.createElement('li');if(chk)li.classList.add('checked');
    if(list){
        let cb=document.createElement('input');cb.type='checkbox';cb.checked=chk;
        cb.onchange=()=>toggleChk(list,item.id,cb.checked);li.appendChild(cb);
    }
    let img=document.createElement('img');img.className='thumb';img.src=item.thumb;li.appendChild(img);
    let m=parseMeta(item);
    let div=document.createElement('div');div.className='details';
    div.innerHTML=`<p class="name">${item.name}</p><span class="price">${item.price}</span><div class="badges"><span class="badge b-store">${m.store}</span><span class="badge b-cat">${m.cat}</span>${m.date?`<span class="badge b-date">${m.date}</span>`:''}</div>`;
    li.appendChild(div);
    let act=document.createElement('div');act.className='actions';
    if(mode!=='custom'){
        let addBtn=document.createElement('button');addBtn.className='btn';addBtn.innerText='＋';
        addBtn.onclick=()=>openModal(item);act.appendChild(addBtn);
    }
    let del=document.createElement('button');del.className='btn btn-danger';del.innerText='✕';
    del.onclick=()=>{
        if(mode==='home')li.remove();
        else if(mode==='history'){delHist(bIdx,item.id);showHistory();}
        else if(mode==='custom'){delCustom(list,item.id);showCustom(list);}
    };
    act.appendChild(del);li.appendChild(act);
    return li;
}

function renderCustomMenu(){
    const cm=document.getElementById('custom-menu');let lists=JSON.parse(localStorage.getItem('lists')||'{}');
    cm.innerHTML=Object.keys(lists).map(k=>`<a href="#" onclick="showCustom('${k}')" style="display:block;padding:6px;color:#333;text-decoration:none">${k} (${lists[k].length})</a>`).join('');
}

function newList(){
    let name=prompt('清單名稱：');if(!name)return;
    let lists=JSON.parse(localStorage.getItem('lists')||'{}');
    if(lists[name]){alert('已存在');return;}
    lists[name]=[];localStorage.setItem('lists',JSON.stringify(lists));
    renderCustomMenu();showCustom(name);
}

function openModal(item){
    let lists=JSON.parse(localStorage.getItem('lists')||'{}');let keys=Object.keys(lists);
    if(!keys.length){alert('請先建立清單');return;}
    const ml=document.getElementById('modal-list');ml.innerHTML='';
    keys.forEach(k=>{
        let div=document.createElement('div');div.className='modal-item';div.innerText=k;
        div.onclick=()=>{lists[k].push({item,chk:false});localStorage.setItem('lists',JSON.stringify(lists));alert('已加入');closeAll();};
        ml.appendChild(div);
    });
    modal.classList.add('show');overlay.classList.add('show');
}

function showCustom(name){
    closeAll();title.innerText=name;
    let lists=JSON.parse(localStorage.getItem('lists')||'{}');let items=lists[name]||[];
    main.innerHTML=`<div class="card"><div class="card-header"><span>項目</span><button class="btn btn-danger" onclick="delList('${name}')">刪除清單</button></div><ul id="c-list"></ul></div>`;
    const ul=document.getElementById('c-list');
    items.forEach(e=>ul.appendChild(createNode(e.item,'custom',e.chk,name)));
}

function toggleChk(list,id,val){
    let lists=JSON.parse(localStorage.getItem('lists')||'{}');
    let t=lists[list].find(e=>e.item.id===id);if(t)t.chk=val;
    localStorage.setItem('lists',JSON.stringify(lists));showCustom(list);
}

function delHist(bIdx,id){
    let h=JSON.parse(localStorage.getItem('h')||'[]');
    h[bIdx].items=h[bIdx].items.filter(i=>i.id!==id);
    if(!h[bIdx].items.length)h.splice(bIdx,1);
    localStorage.setItem('h',JSON.stringify(h));
}

function delCustom(list,id){
    let lists=JSON.parse(localStorage.getItem('lists')||'{}');
    lists[list]=lists[list].filter(e=>e.item.id!==id);
    localStorage.setItem('lists',JSON.stringify(lists));
}

function delList(name){
    if(confirm('確定刪除？')){
        let lists=JSON.parse(localStorage.getItem('lists')||'{}');
        delete lists[name];localStorage.setItem('lists',JSON.stringify(lists));showHome();
    }
}
</script>
</body>
</html>
