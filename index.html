<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本逛街購物小清單</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; padding: 15px; color: #333; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.3rem; text-align: center; margin-bottom: 15px; color: #2c3e50; }
        
        /* 上傳與新增表單區 */
        .form-box { background: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .ocr-btn-box { border: 2px dashed #3498db; background: #ebf5fb; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 12px; cursor: pointer; }
        .ocr-btn-box input { display: none; }
        .ocr-btn-box label { font-weight: bold; color: #3498db; cursor: pointer; display: block; }
        
        .form-box input, .form-box textarea { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
        .form-box button { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }

        /* 卡片清單樣式 */
        .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; gap: 12px; align-items: center; position: relative; transition: 0.2s; }
        .card.purchased { background: #e8f8f5; opacity: 0.75; }
        .card.purchased .title { text-decoration: line-through; color: #7f8c8d; }
        
        .card img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; background: #eee; flex-shrink: 0; }
        .info { flex-grow: 1; }
        .title { font-weight: bold; font-size: 1rem; margin-bottom: 4px; }
        .price { color: #e74c3c; font-weight: bold; font-size: 0.95rem; }
        .note { font-size: 0.85rem; color: #666; margin-top: 4px; }
        
        /* 狀態按鈕與刪除 */
        .actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
        .status-toggle { padding: 6px 10px; font-size: 0.8rem; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
        .status-unbought { background: #f39c12; color: white; }
        .status-bought { background: #27ae60; color: white; }
        .delete-btn { background: none; border: none; color: #ccc; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🛒 日本逛街購物小清單</h1>

    <!-- 上傳/拍照區 -->
    <div class="form-box">
        <div class="ocr-btn-box">
            <label for="cameraInput">📸 拍照或上傳截圖/照片</label>
            <!-- 拿掉 capture 屬性，讓手機可以選擇相機或相簿截圖 -->
            <input type="file" id="cameraInput" accept="image/*" onchange="handleImageUpload(event)">
        </div>

        <input type="text" id="name" placeholder="商品名稱 (例: 參天眼藥水)">
        <input type="text" id="price" placeholder="價格 (例: 480円)">
        <input type="hidden" id="image" value="">
        <textarea id="note" placeholder="備忘/買幾個/在哪看到..." rows="2"></textarea>
        <button onclick="addItem()">加入清單</button>
    </div>

    <!-- 清單顯示區 -->
    <div id="item-list"></div>

    <script>
        let items = JSON.parse(localStorage.getItem('jp_shopping_list')) || [
            { name: "路魯得 (Lulu) 喉嚨藥錠", price: "1280円", image: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=150", note: "藥妝店必買", purchased: false }
        ];

        function render() {
            const listEl = document.getElementById('item-list');
            listEl.innerHTML = '';
            
            items.forEach((item, index) => {
                listEl.innerHTML += `
                    <div class="card ${item.purchased ? 'purchased' : ''}">
                        <img src="${item.image || 'https://via.placeholder.com/80'}" onerror="this.src='https://via.placeholder.com/80'">
                        <div class="info">
                            <div class="title">${item.name}</div>
                            <div class="price">${item.price}</div>
                            <div class="note">${item.note}</div>
                        </div>
                        <div class="actions">
                            <button class="delete-btn" onclick="deleteItem(${index})">×</button>
                            <button class="status-toggle ${item.purchased ? 'status-bought' : 'status-unbought'}" onclick="toggleStatus(${index})">
                                ${item.purchased ? '已購買 ✔️' : '未購買 ⏳'}
                            </button>
                        </div>
                    </div>
                `;
            });
            localStorage.setItem('jp_shopping_list', JSON.stringify(items));
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('image').value = e.target.result;
                    document.getElementById('name').value = "上傳截圖商品 (測試)";
                    document.getElementById('price').value = "500円";
                    alert('圖片/截圖已成功載入！');
                }
                reader.readAsDataURL(file);
            }
        }

        function addItem() {
            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;
            const image = document.getElementById('image').value;
            const note = document.getElementById('note').value;

            if (!name) {
                alert('請至少填寫商品名稱！');
                return;
            }

            items.unshift({ name, price, image, note, purchased: false });
            render();

            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            document.getElementById('image').value = '';
            document.getElementById('note').value = '';
        }

        function toggleStatus(index) {
            items[index].purchased = !items[index].purchased;
            render();
        }

        function deleteItem(index) {
            if(confirm('確定要刪除這個商品嗎？')) {
                items.splice(index, 1);
                render();
            }
        }

        render();
    </script>
</body>
</html>
