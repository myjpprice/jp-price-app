<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本購物清單 - 雅致和風版</title>
    <style>
        :root {
            --text-main: #3d3638;
            --text-sub: #877b7e;
            --bg-gradient: linear-gradient(145deg, #f8f4f0 0%, #efe7e1 50%, #e3dad3 100%);
            --card-bg: rgba(255, 255, 255, 0.55);
            --card-border: rgba(255, 255, 255, 0.75);
            --theme-accent: #9c646c;
            --shadow-subtle: 0 20px 40px rgba(61, 54, 56, 0.04);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", "SF Pro Text", sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            letter-spacing: 0.8px;
        }

        #seasonal-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }

        .navbar, .container, .drawer, .overlay {
            position: relative; z-index: 10;
        }

        /* 頂部導覽 */
        .navbar {
            width: 100%; max-width: 600px;
            padding: 28px 24px 16px 24px;
            display: flex; align-items: center; justify-content: space-between;
            box-sizing: border-box;
        }

        .menu-btn {
            background: none; border: none; font-size: 1.6em; cursor: pointer;
            color: var(--text-main); opacity: 0.85; transition: opacity 0.2s;
            padding: 0; display: flex; align-items: center; justify-content: center;
            line-height: 1;
        }
        .menu-btn:hover { opacity: 1; }

        .nav-title {
            font-size: 0.85em; font-weight: 300; margin: 0;
            letter-spacing: 3px; color: var(--text-sub);
            text-transform: uppercase;
        }

        .container {
            width: 90%; max-width: 460px;
            display: flex; flex-direction: column; gap: 24px;
            padding: 10px 0 40px 0; box-sizing: border-box;
        }

        .upload-section {
            width: 100%;
        }

        .file-label {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            color: var(--text-main); padding: 18px 22px;
            border-radius: 12px; cursor: pointer;
            font-weight: 300; font-size: 0.9em;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-subtle);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .file-label:hover {
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px);
        }
        /* 比例優化：精緻內斂的 26px 圓形與比例適中的加號 */
        .file-label .action-tag {
            font-size: 1.1em; font-weight: 300; color: var(--theme-accent);
            width: 26px; height: 26px; border-radius: 50%;
            border: 1px solid var(--theme-accent);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            line-height: 1;
            padding-bottom: 1px;
        }
        .file-label:hover .action-tag {
            background: var(--theme-accent);
            color: #fff;
        }
        #file-input { display: none; }

        .card-section {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-radius: 16px; border: 1px solid var(--card-border);
            padding: 28px; box-sizing: border-box;
            box-shadow: var(--shadow-subtle);
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: baseline;
            font-weight: 300; font-size: 0.8em; letter-spacing: 2px;
            border-bottom: 1px solid rgba(61, 54, 56, 0.08);
            padding-bottom: 14px; margin-bottom: 16px; color: var(--text-sub);
        }

        ul { list-style: none; padding: 0; margin: 0; }
        li {
            padding: 16px 0;
            display: flex; align-items: center; gap: 16px;
            border-bottom: 1px solid rgba(61, 54, 56, 0.04);
        }
        li:last-child { border-bottom: none; }

        .item-thumb {
            width: 48px; height: 48px; object-fit: cover; border-radius: 8px;
            background: #d8d0cb; border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .item-details { flex-grow: 1; min-width: 0; }
        .item-name {
            font-weight: 400; font-size: 0.9em; margin: 0 0 4px 0;
            color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-price {
            color: var(--theme-accent); font-size: 0.82em; letter-spacing: 0.5px;
        }

        .drawer {
            position: fixed; top: 0; left: -100%; width: 75%; max-width: 260px; height: 100%;
            background: rgba(248, 244, 240, 0.95); backdrop-filter: blur(30px);
            border-right: 1px solid var(--card-border);
            z-index: 1000; transition: left 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box; padding: 32px 24px;
            display: flex; flex-direction: column;
        }
        .drawer.open { left: 0; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(61, 54, 56, 0.15); backdrop-filter: blur(2px);
            display: none; z-index: 999; transition: opacity 0.3s;
        }
        .overlay.show { display: block; }
    </style>
</head>
<body>

    <canvas id="seasonal-canvas"></canvas>

    <div class="navbar">
        <button class="menu-btn" onclick="toggleDrawer(true)">✦</button>
        <h1 class="nav-title">Japan Shopping List</h1>
        <div style="width: 20px;"></div>
    </div>

    <div class="container">
        <div class="upload-section">
            <label for="file-input" class="file-label">
                <span>拍攝或上傳商品照片</span>
                <span class="action-tag">+</span>
            </label>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="card-section">
            <div class="card-header">
                <span>SELECTION LIST</span>
                <span>01 ITEMS</span>
            </div>
            <ul id="shopping-list">
                <li>
                    <div class="item-thumb" style="background: #dfd5ce;"></div>
                    <div class="item-details">
                        <p class="item-name">京都宇治抹茶夾心茶餅</p>
                        <span class="item-price">¥ 1,280</span>
                    </div>
                </li>
            </ul>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleDrawer(false)"></div>
    <div class="drawer" id="history-drawer">
        <h3 style="font-weight:300; font-size:0.85em; letter-spacing:2px; color:var(--text-sub); margin-top:0;">MENU</h3>
        <button onclick="toggleDrawer(false)" style="margin-top:24px; background:none; border:none; text-align:left; cursor:pointer; color:var(--text-main); font-size:0.9em; padding:0;">關閉選單</button>
    </div>

    <script>
        function toggleDrawer(open) {
            document.getElementById('history-drawer').classList.toggle('open', open);
            document.getElementById('overlay').classList.toggle('show', open);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('seasonal-canvas');
            const sCtx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            let particles = Array.from({ length: 22 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3.5 + 1.5,
                speedY: Math.random() * 0.2 + 0.05,
                opacity: Math.random() * 0.35 + 0.1
            }));
            let time = 0;

            function animate() {
                sCtx.clearRect(0, 0, canvas.width, canvas.height);
                time += 0.007;

                // 竹林剪影
                sCtx.save();
                sCtx.fillStyle = 'rgba(115, 102, 98, 0.065)';
                const bambooCount = 6;
                for (let i = 0; i < bambooCount; i++) {
                    let bx = (canvas.width / (bambooCount + 1)) * (i + 1) + Math.sin(time * 0.4 + i) * 18;
                    sCtx.fillRect(bx, 0, 3, canvas.height);
                    for (let y = 100; y < canvas.height; y += 150) {
                        sCtx.fillRect(bx - 3, y, 9, 2);
                    }
                }
                sCtx.restore();

                // 夏日浮動光點
                particles.forEach(p => {
                    sCtx.save();
                    sCtx.globalAlpha = p.opacity;
                    sCtx.fillStyle = '#ffffff';
                    sCtx.beginPath();
                    sCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    sCtx.fill();
                    sCtx.restore();

                    p.y += p.speedY;
                    p.x += Math.sin(time + p.y / 35) * 0.1;
                    if (p.y > canvas.height) { p.y = 0; p.x = Math.random() * canvas.width; }
                });

                requestAnimationFrame(animate);
            }
            animate();
        });
    </script>
</body>
</html>
